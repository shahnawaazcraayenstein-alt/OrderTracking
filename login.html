<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in | Pizza Order Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  html { color-scheme: light; }
  body { margin: 0; }
  [hidden] { display: none !important; }

  /* Layout: one sign-in panel near the top of the page, same look as the order screen. */
  :root {
    --bg: #E8ECEE;
    --panel: #F6F8F9;
    --paper: #FFFFFF;
    --ink: #172126;
    --ink-2: #4A5961;
    --line: #C3CCD1;
    --accent: #C42F1A;
    --accent-ink: #FFFFFF;
    --focus: #1D6FB8;
    --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171A;
      --panel: #192024;
      --paper: #20292E;
      --ink: #E8EEF0;
      --ink-2: #9FAEB5;
      --line: #34424A;
      --accent: #EE6A52;
      --accent-ink: #1C0E0B;
      --focus: #6DB3F2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171A;
    --panel: #192024;
    --paper: #20292E;
    --ink: #E8EEF0;
    --ink-2: #9FAEB5;
    --line: #34424A;
    --accent: #EE6A52;
    --accent-ink: #1C0E0B;
    --focus: #6DB3F2;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 9vh 44px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .wrap { max-width: 400px; margin: 0 auto; display: grid; gap: 22px; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.2rem, 9vw, 3rem);
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px 20px 20px; display: grid; gap: 16px; min-width: 0; }
  .panel h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1.1; }

  .field { display: grid; gap: 6px; min-width: 0; }
  label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-2); }
  input {
    width: 100%;
    min-width: 0;
    height: 48px;
    padding: 0 12px;
    font: 500 1rem/1.2 var(--font-body);
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .pw { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .toggle {
    height: 48px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    font: 600 0.85rem var(--font-body);
    cursor: pointer;
  }
  .submit {
    height: 52px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 700 1.2rem/1 var(--font-display);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .submit:hover { filter: brightness(1.08); }
  .submit:disabled { opacity: 0.6; cursor: progress; }
  .err { margin: 0; min-height: 1.4em; font-size: 0.95rem; color: var(--accent); font-weight: 500; }
  .hint { margin: 0; font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pizza Order Book</h1>

  <form id="loginForm" class="panel" novalidate>
    <h2>Staff sign in</h2>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="100" autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200">
        <button class="toggle" id="toggle" type="button" aria-controls="password" aria-pressed="false">Show</button>
      </div>
    </div>

    <p class="err" id="err" role="alert"></p>
    <button class="submit" id="submit" type="submit">Sign in</button>
  </form>

</div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }

  $("toggle").addEventListener("click", function () {
    var show = $("password").type === "password";
    $("password").type = show ? "text" : "password";
    $("toggle").textContent = show ? "Hide" : "Show";
    $("toggle").setAttribute("aria-pressed", show ? "true" : "false");
  });

  $("loginForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var err = $("err");
    err.textContent = "";
    var username = $("username").value.trim();
    var password = $("password").value;
    if (!username) { err.textContent = "Enter your username."; $("username").focus(); return; }
    if (!password) { err.textContent = "Enter your password."; $("password").focus(); return; }

    var btn = $("submit");
    btn.disabled = true;
    try {
      var res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ username: username, password: password })
      });
      var json = {};
      try { json = await res.json(); } catch (e) { /* empty body */ }
      if (res.ok) { window.location.replace("/"); return; }
      err.textContent = json.error || "Could not sign in. Try again.";
      $("password").value = "";
      $("password").focus();
    } catch (e) {
      err.textContent = "Cannot reach the server. Check the connection and try again.";
    }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
